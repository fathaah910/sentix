name: Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:
  test:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Sentix
        run: python -m pip install -e .

      - name: Install pytest
        run: python -m pip install pytest

      - name: Verify package
        run: python -c "import sentix; print(sentix.__file__)"

      - name: Run tests
        run: python -m pytest